<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etykiety Almus</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #181c27;
    --surface2: #1e2335;
    --border: #2a3050;
    --accent: #4fffb0;
    --accent2: #3dd9f5;
    --warn: #ffcc00;
    --danger: #ff5c5c;
    --text: #e8eaf2;
    --muted: #6b7399;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-wrap: wrap;
  }
  .logo-mark {
    width: 34px; height: 34px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 800; color: #0f1117;
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; font-weight: 700; letter-spacing: .04em; }
  .badge {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    cursor: pointer;
    transition: border-color .2s, color .2s;
    text-decoration: none;
  }
  .badge:hover { border-color: var(--accent); color: var(--accent); }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  #clock { font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; margin-left: auto; }

  /* QUEUE */
  .queue-bar {
    padding: 10px 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: none;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--muted);
  }
  .queue-bar strong { color: var(--text); }

  /* MAIN SPLIT */
  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 0;
  }

  /* LEFT — DROP ZONE */
  .drop-zone {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    gap: 18px;
    position: relative;
    cursor: pointer;
    transition: background .2s;
    min-height: 420px;
  }
  .drop-zone:hover { background: rgba(79,255,176,.03); }
  .drop-zone.has-image { padding: 0; cursor: default; }
  .drop-zone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 2;
  }
  .drop-zone.has-image input[type=file] { display: none; }
  .drop-icon { font-size: 50px; filter: grayscale(1) opacity(.35); }
  .drop-label {
    text-align: center; font-size: 15px; font-weight: 600;
    color: var(--muted); line-height: 1.6;
  }
  .drop-label span {
    display: block; font-size: 11px;
    font-family: 'DM Mono', monospace; color: var(--border); margin-top: 4px;
  }
  #preview-img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: none;
    background: #0a0c12;
    padding: 16px;
  }
  .drop-zone.has-image #preview-img { display: block; }
  .change-btn {
    position: absolute; top: 12px; left: 12px;
    background: rgba(15,17,23,.85);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-family: 'DM Mono', monospace; font-size: 11px;
    padding: 5px 10px; cursor: pointer; display: none; z-index: 10;
    transition: color .2s, border-color .2s;
  }
  .drop-zone.has-image .change-btn { display: block; }
  .change-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* SCAN OVERLAY */
  .scan-overlay {
    position: absolute; inset: 0;
    background: rgba(15,17,23,.88);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; z-index: 20;
  }
  .scan-overlay.active { display: flex; }
  .scan-pulse {
    width: 56px; height: 56px;
    border: 3px solid var(--accent); border-radius: 50%;
    animation: pulse 1s ease infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(.88); opacity: .6; }
    50% { transform: scale(1.08); opacity: 1; }
  }
  .scan-text { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--accent2); }

  /* RIGHT — FORM */
  .form-panel {
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .scan-header {
    padding: 20px 26px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .scan-header h2 { font-size: 14px; font-weight: 700; }
  .status-chip {
    margin-left: auto;
    font-family: 'DM Mono', monospace; font-size: 11px;
    padding: 4px 10px; border-radius: 100px;
    background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .status-chip.scanning { border-color: var(--accent2); color: var(--accent2); }
  .status-chip.done { border-color: var(--accent); color: var(--accent); }
  .status-chip.error { border-color: var(--danger); color: var(--danger); }
  .spinner {
    width: 8px; height: 8px;
    border: 2px solid currentColor; border-top-color: transparent;
    border-radius: 50%; animation: spin .6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .fields {
    padding: 18px 26px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    flex: 1;
  }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.full { grid-column: 1/-1; }
  .field label {
    font-family: 'DM Mono', monospace; font-size: 10px;
    letter-spacing: .1em; color: var(--muted); text-transform: uppercase;
  }
  .field input {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 7px; color: var(--text);
    font-family: 'DM Mono', monospace; font-size: 13px;
    padding: 9px 12px; outline: none;
    transition: border-color .2s, background .2s;
  }
  .field input:focus { border-color: var(--accent2); background: #1a2030; }
  .field input.filled { border-color: rgba(79,255,176,.4); }

  .actions {
    padding: 18px 26px;
    border-top: 1px solid var(--border);
    display: flex; gap: 10px; align-items: center;
  }
  .btn-approve {
    flex: 1; background: var(--accent); color: #0f1117;
    border: none; border-radius: 8px; padding: 12px;
    font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px;
    cursor: pointer; transition: opacity .2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-approve:hover { opacity: .85; }
  .btn-approve:disabled { opacity: .3; cursor: not-allowed; }
  .btn-skip {
    background: transparent; border: 1px solid var(--border);
    border-radius: 8px; color: var(--muted);
    padding: 12px 18px; font-family: 'Syne', sans-serif; font-size: 14px;
    cursor: pointer; transition: border-color .2s, color .2s;
  }
  .btn-skip
